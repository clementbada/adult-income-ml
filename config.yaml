# Project configuration: every value we may want to change lives here, not in the code.
# Same content as the CONFIG dictionary of notebook 01. New sections are added by later steps.

seed: 42                      # fixed random seed, used everywhere -> reproducible results

data:
  openml_name: adult          # Adult / Census Income
  openml_version: 2
  target_column: class        # raw target column
  positive_label: ">50K"      # positive class (Y = 1)
  raw_cache_dir: data/raw     # local copy of the OpenML download (not committed)
  processed_dir: data/processed   # dev / test split files (not committed)

split:
  test_size: 0.20             # 80% development / 20% test, stratified on the target
  n_folds: 5                  # 5-fold StratifiedKFold inside the development set

paths:
  figures_dir: reports/figures

features:                     # STEP 2 (src/features.py)
  capital: indicators         # decision 7: has_capital_gain / has_capital_loss only
                              # ("amounts" = STEP 6 reference, "none" = no capital information)
  bands: [age_band, hours_band]   # added for the linear model only (trees find their own cut points)
  age_bins: [0, 25, 35, 45, 55, 65, .inf]          # right-inclusive edges: life stages
  age_labels: ["17-25", "26-35", "36-45", "46-55", "56-65", "66+"]
  hours_bins: [-.inf, 34, 40, 49, .inf]            # part-time / standard week / 41-49 / long hours
  hours_labels: ["<35", "35-40", "41-49", "50+"]
  rare_min_frequency: 0.005   # categories below 0.5% of training rows are grouped

models:                       # STEP 3 (src/models.py); tuned with Optuna in STEP 5
  logistic:
    penalty: l2               # Ridge penalty (Session 2): shrinks coefficients, stable with correlated inputs
    C: 1.0                    # C = 1 / lambda (scikit-learn default); chosen in STEP 5
    max_iter: 2000            # enough iterations for the solver to converge
  random_forest:              # STEP 5: default values; the ones in tuning.search_spaces are tuned
    n_estimators: 300         # number of trees averaged
    min_samples_leaf: 1       # minimum number of people in a leaf
    max_features: sqrt        # share of columns tried at each split
    n_jobs: -1                # use every CPU core
  lightgbm:                   # STEP 5: default values; the ones in tuning.search_spaces are tuned
    n_estimators: 300         # number of boosting rounds (trees added one after the other)
    learning_rate: 0.05       # how much each new tree corrects the previous ones
    num_leaves: 31            # size of each tree
    subsample_freq: 1         # needed for `subsample` (row sampling) to be active at every round
    verbose: -1               # no LightGBM log lines

evaluation:
  default_threshold: 0.5      # reference only; the operating threshold is chosen in STEP 4

tracking:                     # MLflow (requirement 7)
  experiment_name: adult-income
  tracking_dir: mlruns        # local folder, not committed

imbalance:                    # STEP 4 (src/imbalance.py), Session 6
  cost_fp: 1                  # one useless call = 1 unit (reference)
  cost_fn: 5                  # one missed >50K prospect = 5 units: ~EUR 300 expected value vs ~EUR 50 per call (decision 27)
  cost_fn_sensitivity: [2, 3, 5, 10]   # robustness check of the business assumption
  remedy: threshold_only      # chosen in STEP 4: same result as class weights / SMOTE, probabilities kept intact

tuning:                       # STEP 5 (src/tuning.py): Optuna, requirement 6
  results_dir: reports/tuning # tables read by notebook 05 (small CSV / YAML files, committed)
  sampler_seed: 42            # TPE sampler seed: the same trials are proposed at every run
  n_startup_trials: 10        # first trials drawn at random, before TPE starts to learn
  pruner_warmup_folds: 2      # a trial can be stopped early only after its first 2 folds
  n_trials:                   # trials per model, 5-fold CV each (logistic has 1 hyperparameter)
    logistic: 20
    random_forest: 40
    lightgbm: 60
  nested:                     # nested CV (Session 5): honest score of "tune with Optuna, then fit"
    inner_folds: 3            # inner CV used by Optuna inside each of the 5 outer folds
    n_trials:                 # smaller budget: 5 outer folds x n_trials x 3 inner fits
      logistic: 10
      random_forest: 15
      lightgbm: 20
  search_spaces:              # type: float / int / categorical; log: true = log scale
    logistic:
      C: {type: float, low: 0.001, high: 100.0, log: true}          # regularisation strength (1 / lambda)
    random_forest:
      encoding: {type: categorical, choices: [onehot, ordinal]}     # how categories reach the trees (decision 33)
      n_estimators: {type: int, low: 100, high: 500, step: 50}       # more trees = more stable average
      max_depth: {type: int, low: 4, high: 30}                       # depth of each tree (bias / variance)
      min_samples_leaf: {type: int, low: 1, high: 50, log: true}     # bigger leaves = smoother model
      max_features: {type: float, low: 0.05, high: 0.7}              # share of columns tried at each split
    lightgbm:
      n_estimators: {type: int, low: 100, high: 2000, step: 50}      # number of boosting rounds
      learning_rate: {type: float, low: 0.01, high: 0.2, log: true}  # step size of each round
      num_leaves: {type: int, low: 8, high: 128, log: true}          # size (complexity) of each tree
      min_child_samples: {type: int, low: 5, high: 200, log: true}   # minimum people per leaf
      reg_lambda: {type: float, low: 0.001, high: 100.0, log: true}  # L2 penalty on leaf values (Session 2 idea)
      subsample: {type: float, low: 0.5, high: 1.0}                  # share of rows used by each tree
      colsample_bytree: {type: float, low: 0.2, high: 1.0}           # share of columns used by each tree

final:                        # STEP 6 (src/final.py): freeze -> refit on development -> evaluate ONCE on test
  model: lightgbm             # decision 35, chosen on the development set before the test set is opened
  reference: logistic         # tuned baseline, measured on the test set for comparison only
  results_dir: reports/final  # tables, test probabilities (reused in STEPS 7 and 9), frozen settings

calibration:                  # STEP 7 (src/calibration.py), Session 7
  n_bins: 10                  # equal-width bins for the reliability diagram and the ECE (as in the Session 7 notebook)
  min_folds_better: 4         # a calibrator is kept only if it lowers the Brier score on >= 4 of the 5 development folds
  results_dir: reports/calibration
