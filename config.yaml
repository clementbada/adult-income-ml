# Project configuration: every value we may want to change lives here, not in the code.
# Same content as the CONFIG dictionary of notebook 01. New sections are added by later steps.

seed: 42                      # fixed random seed, used everywhere -> reproducible results

data:
  openml_name: adult          # Adult / Census Income
  openml_version: 2
  target_column: class        # raw target column
  positive_label: ">50K"      # positive class (Y = 1)
  raw_cache_dir: data/raw     # local copy of the OpenML download (not committed)
  processed_dir: data/processed   # dev / test split files (not committed)

split:
  test_size: 0.20             # 80% development / 20% test, stratified on the target
  n_folds: 5                  # 5-fold StratifiedKFold inside the development set

paths:
  figures_dir: reports/figures

features:                     # STEP 2 (src/features.py)
  capital: indicators         # decision 7: has_capital_gain / has_capital_loss only
                              # ("amounts" = STEP 6 reference, "none" = no capital information)
  bands: [age_band, hours_band]   # added for the linear model only (trees find their own cut points)
  age_bins: [0, 25, 35, 45, 55, 65, .inf]          # right-inclusive edges: life stages
  age_labels: ["17-25", "26-35", "36-45", "46-55", "56-65", "66+"]
  hours_bins: [-.inf, 34, 40, 49, .inf]            # part-time / standard week / 41-49 / long hours
  hours_labels: ["<35", "35-40", "41-49", "50+"]
  rare_min_frequency: 0.005   # categories below 0.5% of training rows are grouped

models:                       # STEP 3 (src/models.py); tuned with Optuna in STEP 5
  logistic:
    penalty: l2               # Ridge penalty (Session 2): shrinks coefficients, stable with correlated inputs
    C: 1.0                    # C = 1 / lambda (scikit-learn default); chosen in STEP 5
    max_iter: 2000            # enough iterations for the solver to converge

evaluation:
  default_threshold: 0.5      # reference only; the operating threshold is chosen in STEP 4

tracking:                     # MLflow (requirement 7)
  experiment_name: adult-income
  tracking_dir: mlruns        # local folder, not committed
